<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">NT-R favicon</title>
  <desc id="desc">A navy square favicon with an amber reload arc, network nodes, and a white NT-R monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="40" x2="440" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#243d6b"/>
      <stop offset="0.52" stop-color="#0f1f3d"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="27%" r="58%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.36"/>
      <stop offset="0.62" stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#glow)"/>

  <!-- Subtle network constellation echoing the site hero. -->
  <g stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M82 342 L142 278 L222 302 L290 236 L386 256 L430 188" stroke="#f59e0b" stroke-opacity="0.20" stroke-width="9"/>
    <path d="M124 164 L198 214 L282 172 L368 118" stroke="#e8edf5" stroke-opacity="0.13" stroke-width="7"/>
    <path d="M104 418 L178 366 L284 388 L398 340" stroke="#f59e0b" stroke-opacity="0.12" stroke-width="7"/>
  </g>
  <g>
    <circle cx="82" cy="342" r="13" fill="#f59e0b" fill-opacity="0.62"/>
    <circle cx="142" cy="278" r="11" fill="#f59e0b" fill-opacity="0.55"/>
    <circle cx="222" cy="302" r="9" fill="#e8edf5" fill-opacity="0.36"/>
    <circle cx="290" cy="236" r="10" fill="#f59e0b" fill-opacity="0.55"/>
    <circle cx="386" cy="256" r="13" fill="#f59e0b" fill-opacity="0.72"/>
    <circle cx="430" cy="188" r="8" fill="#e8edf5" fill-opacity="0.35"/>
    <circle cx="124" cy="164" r="8" fill="#f59e0b" fill-opacity="0.52"/>
    <circle cx="198" cy="214" r="6" fill="#e8edf5" fill-opacity="0.35"/>
    <circle cx="282" cy="172" r="7" fill="#f59e0b" fill-opacity="0.48"/>
    <circle cx="368" cy="118" r="9" fill="#f59e0b" fill-opacity="0.66"/>
  </g>

  <!-- Reload arc: visual cue for “Reloaded”. -->
  <g filter="url(#softShadow)">
    <path d="M380 151 A168 168 0 0 1 409 329" fill="none" stroke="#f59e0b" stroke-width="34" stroke-linecap="round"/>
    <path d="M413 316 L431 386 L364 360 Z" fill="#f59e0b"/>
  </g>

  <!-- NT-R monogram, drawn as strokes for crisp favicon legibility. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)">
    <g stroke="#ffffff" stroke-width="34">
      <path d="M88 346 V174 L178 346 V174"/>
      <path d="M208 174 H306 M257 174 V346"/>
      <path d="M379 346 V174 H423 C459 174 478 194 478 223 C478 252 458 271 423 271 H379 M423 271 L475 346"/>
    </g>
    <path d="M322 260 H351" stroke="#f59e0b" stroke-width="31"/>
  </g>
</svg>
